name: ios-simulator-screenshot

# 不需要 Apple ID、不需要 iPhone：在 macOS runner 上启动 iOS 模拟器
# （Apple 官方的 iOS Simulator），把 App 装进去、打开、截图上传。
# 模拟器不校验签名，所以 --no-codesign 的产物直接能跑。
on:
  workflow_dispatch:
    inputs:
      wait_seconds:
        description: 'Seconds to wait after launch before the screenshot'
        required: false
        default: '20'

jobs:
  screenshot:
    runs-on: macos-15-intel
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get

      - name: Patch iOS plugin sources
        working-directory: .
        run: bash tooling/ios-ci-plugin-patches.sh

      - name: Build for the simulator
        run: flutter build ios --simulator --debug

      - name: Boot an iPhone simulator, install, launch, screenshot
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ids = [x["udid"] for rt, xs in d.items() for x in xs if x["name"].startswith("iPhone")]
          print(ids[0] if ids else "")')
          echo "device: $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/ios/iphonesimulator/Runner.app
          mkdir -p shots
          set -x
          # --console-pty attaches the app's stdout/stderr (uncaught Dart
          # exceptions land there). macOS has no GNU `timeout`, so the child is
          # killed by hand and reaped with `wait`; a bare background child would
          # keep the step alive forever.
          xcrun simctl launch --console-pty "$DEVICE" io.github.ccch1mneyyy.dshApp > app-log.txt 2>&1 &
          LAUNCHER=$!
          for t in 10 30 60; do
            sleep 10
            xcrun simctl io "$DEVICE" screenshot "shots/${t}s.png" || true
          done
          kill -TERM "$LAUNCHER" 2>/dev/null || true
          sleep 2
          kill -KILL "$LAUNCHER" 2>/dev/null || true
          wait "$LAUNCHER" 2>/dev/null || true
          set +x
          echo "=== app-log.txt (Dart side) ==="
          cat app-log.txt || true
          echo "=== 截图 ==="
          ls -la shots

      - name: App logs (crash diagnosis)
        if: always()
        run: |
          xcrun simctl spawn booted log show --last 3m --style compact \
            --predicate 'process == "Runner"' > ../runner-log.txt || true
          tail -60 ../runner-log.txt || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-shots
          path: |
            app/shots/*.png
            app/app-log.txt
            runner-log.txt
          retention-days: 30
